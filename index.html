<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أسعار الخضروات والفواكه</title>
  <meta name="description" content="أسعار الخضروات والفواكه محدثة يومياً">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>أسعار الخضروات والفواكه</h1>
      <p class="last-update">آخر تحديث: <span id="update-date">--</span></p>
    </div>

  <main class="container">
    <!-- مؤشر التحميل -->
    <div class="loading" id="loading">جاري تحميل الأسعار...</div>

    <!-- رسالة الخطأ -->
    <div class="error" id="error" style="display:none"></div>

    <!-- تحذير عدم الاتصال -->
    <div class="warning" id="warning" style="display:none"></div>

    <!-- شبكة المنتجات -->
    <div id="products-grid" class="products-grid"></div>
  </main>

  <footer>
    <div class="container">
      <p>جميع الأسعار محدثة يومياً &copy; <span id="year">2026</span></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
